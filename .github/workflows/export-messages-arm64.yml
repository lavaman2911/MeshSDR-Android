name: export-messages validation
on:
  push:
    branches: [export-messages]
  pull_request:
    branches: [export-messages]
jobs:
  pi-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Compile native PHY
        run: |
          cmake -S desktop/native -B desktop/build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/build-native --parallel 2
          mkdir -p desktop/resources/linux-arm64
          install -m 755 desktop/build-native/libmeshsdr_lora.so desktop/resources/linux-arm64/
      - name: Compile and test desktop app
        working-directory: desktop
        run: gradle clean test packageDeb
      - name: Check Python receiver syntax
        run: python3 -m py_compile receiver/app.py receiver/test_messages.py
